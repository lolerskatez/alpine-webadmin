                                <div class="modal-body">
                                    <div class="form-row">
                                        <label for="sshkeys-input">authorized_keys</label>
                                        <textarea id="sshkeys-input" x-model="sshKeysContent" rows="12" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;" placeholder="ssh-ed25519 AAAAC3NzaC... user@host"></textarea>
                                    </div>
                                </div>
                                <div class="modal-actions">
                                    <button @click="saveSshKeys()" class="btn">Save</button>
                                    <button @click="closeSshKeys()" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ CRON ============ -->
                    <section x-show="tab === 'cron'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="cron-heading">
                        <h2 id="cron-heading" class="section-title">Scheduled Tasks</h2>

                        <div class="toolbar">
                            <button @click="loadCron()" class="btn" aria-label="Refresh cron">Refresh</button>
                            <button @click="showCronEdit = true" class="btn btn-secondary" aria-label="Edit cron">Edit</button>
                        </div>

                        <div x-show="showCronEdit" class="panel">
                            <div class="panel-header"><h3>Edit Cron</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <textarea x-model="cronContent" rows="12" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;" placeholder="# min hour day month weekday command&#10;0 2 * * * /usr/sbin/backup"></textarea>
                                </div>
                                <div class="btn-group">
                                    <button @click="saveCron()" class="btn">Save</button>
                                    <button @click="showCronEdit = false" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:400px;white-space:pre-wrap;" x-text="cronContent || 'No cron jobs configured.'"></pre>
                            </div>
                        </div>
                    </section>

                    <!-- ============ PROCESSES ============ -->
                    <section x-show="tab === 'processes'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="processes-heading">
                        <h2 id="processes-heading" class="section-title">Processes</h2>

                        <div class="toolbar">
                            <div class="toolbar-group">
                                <button @click="loadProcesses()" class="btn" aria-label="Refresh processes">Refresh</button>
                            </div>
                            <div class="toolbar-group">
                                <input type="search"
                                       x-model="processFilter"
                                       placeholder="Filter processes..."
                                       class="search-input"
                                       aria-label="Filter processes">
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="System processes">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">PID</th>
                                            <th role="columnheader">Name</th>
                                            <th role="columnheader">User</th>
                                            <th role="columnheader">State</th>
                                            <th role="columnheader">Command</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="p in filteredProcesses()" :key="p.pid">
                                            <tr role="row">
                                                <td role="cell" x-text="p.pid" class="mono"></td>
                                                <td role="cell" x-text="p.name"></td>
                                                <td role="cell" x-text="p.user"></td>
                                                <td role="cell" x-text="p.state"></td>
                                                <td role="cell" class="mono" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;" :title="p.command" x-text="p.command"></td>
                                                <td role="cell" class="actions-col">
                                                    <button @click="killProcess(p.pid)" class="btn btn-sm btn-danger" aria-label="Kill process">Kill</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="filteredProcesses().length === 0" class="empty-state">No processes found.</div>
                            </div>
                        </div>
                    </section>

                    <section x-show="tab === 'logs'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="logs-heading">
                        <h2 id="logs-heading" class="section-title">System Logs</h2>

                        <div class="toolbar">
                            <div class="toolbar-group">
                                <button @click="toggleLogs()"
                                        class="btn"
                                        :class="{'btn-primary': logsRunning}"
                                        :aria-label="logsRunning ? 'Pause log stream' : 'Resume log stream'"
                                        x-text="logsRunning ? 'Pause' : 'Stream'"></button>
                                <button @click="clearLogs()" class="btn btn-secondary" aria-label="Clear log display">Clear</button>
                            </div>
                            <div class="toolbar-group">
                                <input type="search"
                                       x-model="logFilter"
                                       placeholder="Filter logs..."
                                       class="search-input"
                                       aria-label="Filter log lines">
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Live Stream</h3></div>
                            <div class="panel-body">
                                <div class="log-container"
                                     role="log"
                                     aria-live="off"
                                     aria-label="System log stream"
                                     x-ref="logContainer">
                                    <template x-for="line in filteredLogs()" :key="line.id">
                                        <div class="log-line" :class="'log-' + line.level" x-text="line.text"></div>
                                    </template>
                                    <div x-show="logLines.length === 0" class="empty-state">No log data. Click Stream to start.</div>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>History</h3></div>
                            <div class="panel-body">
                                <div class="toolbar">
                                    <div class="toolbar-group">
                                        <input type="search"
                                               x-model="logHistoryFilter"
                                               placeholder="Search history..."
                                               class="search-input"
                                               @keydown.enter="searchLogHistory()"
                                               aria-label="Search log history">
                                        <button @click="searchLogHistory()" class="btn" aria-label="Search">Search</button>
                                    </div>
                                    <div class="toolbar-group">
                                        <button @click="prevLogHistory()" class="btn btn-secondary" :disabled="logHistoryOffset === 0">Previous</button>
                                        <button @click="nextLogHistory()" class="btn btn-secondary" :disabled="logHistoryOffset + logHistoryLimit >= logHistoryTotal">Next</button>
                                        <span class="toolbar-meta" x-text="logHistoryTotal + ' lines' + (logHistoryTotal > 0 ? ' (' + (logHistoryOffset + 1) + '-' + Math.min(logHistoryOffset + logHistoryLimit, logHistoryTotal) + ')' : '')"></span>
                                    </div>
                                </div>
                                <div class="log-container" role="log" aria-live="off" aria-label="Historical log lines">
                                    <template x-for="line in logHistory" :key="line">
                                        <div class="log-line" x-text="line"></div>
                                    </template>
                                    <div x-show="logHistory.length === 0" class="empty-state">No log history found.</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ SESSIONS ============ -->
                    <section x-show="tab === 'sessions'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="sessions-heading">
                        <h2 id="sessions-heading" class="section-title">Active Sessions</h2>

                        <div class="toolbar">
                            <button @click="loadSessions()" class="btn" aria-label="Refresh sessions">Refresh</button>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Active sessions">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Username</th>
                                            <th role="columnheader">IP Address</th>
                                            <th role="columnheader">User Agent</th>
                                            <th role="columnheader">Created</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="s in sessions" :key="s.id">
                                            <tr role="row" :class="{'row-highlight': s.isCurrent}">
                                                <td role="cell">
                                                    <span x-text="s.username"></span>
                                                    <span x-show="s.isCurrent" class="badge badge-info">You</span>
                                                </td>
                                                <td role="cell" x-text="s.ip" class="mono"></td>
                                                <td role="cell" x-text="s.user_agent" class="description-cell" :title="s.user_agent"></td>
                                                <td role="cell" x-text="formatTime(s.created_at)"></td>
                                                <td role="cell" class="actions-col">
                                                    <button class="btn btn-sm btn-danger"
                                                            @click="revokeSession(s.id)"
                                                            :disabled="s.isCurrent"
                                                            :aria-label="'Revoke session from ' + s.ip">Revoke</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="sessions.length === 0" class="empty-state">No active sessions.</div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ MODULES ============ -->
                    <section x-show="tab === 'modules'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="modules-heading">
                        <h2 id="modules-heading" class="section-title">Kernel Modules</h2>

                        <div class="toolbar">
                            <button @click="loadKMod()" class="btn" aria-label="Refresh modules">Refresh</button>
                            <button @click="showKModForm = true" class="btn btn-secondary" aria-label="Load module">Load Module</button>
                        </div>

                        <div x-show="showKModForm" class="panel">
                            <div class="panel-header"><h3>Load Module</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <label for="kmod-name">Module name</label>
                                    <input id="kmod-name" type="text" x-model="kmodForm.module" placeholder="ext4">
                                </div>
                                <div class="btn-group">
                                    <button @click="loadModule()" class="btn">Load</button>
                                    <button @click="showKModForm = false" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Loaded Modules</h3></div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Kernel modules">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Module</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="mod in kmodModules" :key="mod">
                                            <tr role="row">
                                                <td role="cell" x-text="mod"></td>
                                                <td role="cell" class="actions-col">
                                                    <button @click="unloadModule(mod)" class="btn btn-sm btn-danger" aria-label="Unload module">Unload</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="kmodModules.length === 0" class="empty-state">No module data available.</div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ SYSTEM ============ -->
                    <section x-show="tab === 'system'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="system-heading">
                        <h2 id="system-heading" class="section-title">System</h2>

                        <div class="panel">
                            <div class="panel-header"><h3>System Information</h3></div>
                            <div class="panel-body">
                                <div class="info-grid">
                                    <div class="info-row">
                                        <span class="info-label">Hostname</span>
                                        <span class="info-value" x-show="!showHostnameEdit" x-text="sysInfo.hostname || telemetry.hostname || '-'"></span>
                                        <template x-if="showHostnameEdit">
                                            <div class="inline-form">
                                                <input type="text" x-model="newHostname" @keydown.enter="setHostname()" aria-label="New hostname">
                                                <button @click="setHostname()" class="btn btn-sm">Save</button>
                                                <button @click="showHostnameEdit = false" class="btn btn-sm btn-secondary">Cancel</button>
                                            </div>
                                        </template>
                                        <button x-show="!showHostnameEdit" @click="showHostnameEdit = true" class="btn btn-sm btn-secondary" aria-label="Edit hostname">Edit</button>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">OS</span>
                                        <span class="info-value" x-text="sysInfo.os || '-'"></span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Kernel</span>
                                        <span class="info-value" x-text="sysInfo.kernel || '-'"></span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">CPU Cores</span>
                                        <span class="info-value" x-text="sysInfo.cpu_count || '-'"></span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Total Memory</span>
                                        <span class="info-value" x-text="formatKB(sysInfo.total_mem_kb)"></span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Uptime</span>
                                        <span class="info-value" x-text="formatUptime(sysInfo.uptime_sec)"></span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Version</span>
                                        <span class="info-value" x-text="version || '-'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Timezone / NTP</h3></div>
                            <div class="panel-body">
                                <div class="info-grid">
                                    <div class="info-row">
                                        <span class="info-label">Timezone</span>
                                        <span class="info-value" x-show="!showTimezoneEdit" x-text="timezone || '-'"></span>
                                        <template x-if="showTimezoneEdit">
                                            <div class="inline-form">
                                                <input type="text" x-model="timezone" placeholder="Europe/London" aria-label="Timezone">
                                                <button @click="saveTimezone()" class="btn btn-sm">Save</button>
                                                <button @click="showTimezoneEdit = false" class="btn btn-sm btn-secondary">Cancel</button>
                                            </div>
                                        </template>
                                        <button x-show="!showTimezoneEdit" @click="showTimezoneEdit = true" class="btn btn-sm btn-secondary" aria-label="Edit timezone">Edit</button>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">NTP</span>
                                        <span class="info-value">
                                            <span class="badge" :class="ntpEnabled ? 'badge-ok' : 'badge-warning'" x-text="ntpEnabled ? 'Enabled' : 'Disabled'"></span>
                                            <button @click="toggleNtp()" class="btn btn-sm btn-secondary" style="margin-left:0.5rem;" x-text="ntpEnabled ? 'Disable' : 'Enable'" aria-label="Toggle NTP"></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>System Clock</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <label for="clock-input">Date/Time</label>
                                    <input id="clock-input" type="text" x-model="clockDatetime" placeholder="YYYY-MM-DD HH:MM:SS" aria-label="System clock datetime">
                                </div>
                                <div class="btn-group">
                                    <button @click="saveClock()" class="btn">Set Clock</button>
                                    <button @click="clockDatetime = ''" class="btn btn-secondary">Clear</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>SSH Configuration</h3></div>
                            <div class="panel-body">
                                <div x-show="!showSshConfigEdit">
                                    <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all;" x-text="sshConfig || 'No SSH config loaded.'"></pre>
                                    <button @click="showSshConfigEdit = true" class="btn btn-sm btn-secondary" style="margin-top:0.5rem">Edit</button>
                                </div>
                                <div x-show="showSshConfigEdit">
                                    <div class="form-row">
                                        <textarea x-model="sshConfig" rows="12" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;"></textarea>
                                    </div>
                                    <div class="btn-group">
                                        <button @click="saveSshConfig()" class="btn">Save</button>
                                        <button @click="showSshConfigEdit = false" class="btn btn-secondary">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel panel-warning">
                            <div class="panel-header"><h3>Power Control</h3></div>
                            <div class="panel-body">
                                <p class="panel-text">These actions will affect system availability. Use with caution.</p>
                                <div class="btn-group">
                                    <button @click="confirmReboot = true" class="btn btn-warning" aria-label="Reboot system">Reboot</button>
                                    <button @click="confirmShutdown = true" class="btn btn-danger" aria-label="Shutdown system">Shutdown</button>
                                </div>
                            </div>
                        </div>

                        <!-- Reboot confirmation -->
                        <div x-show="confirmReboot" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="reboot-title">
                            <div class="modal">
                                <div class="modal-header">
                                    <h3 id="reboot-title">Confirm Reboot</h3>
                                    <button @click="confirmReboot = false" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <p>Are you sure you want to reboot the system? All active connections will be interrupted.</p>
                                    <div class="modal-actions">
                                        <button @click="confirmReboot = false" class="btn btn-secondary">Cancel</button>
                                        <button @click="powerAction('reboot')" class="btn btn-warning">Reboot</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Shutdown confirmation -->
                        <div x-show="confirmShutdown" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="shutdown-title">
                            <div class="modal">
                                <div class="modal-header">
                                    <h3 id="shutdown-title">Confirm Shutdown</h3>
                                    <button @click="confirmShutdown = false" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <p>Are you sure you want to shut down the system? You will lose remote access.</p>
                                    <div class="modal-actions">
                                        <button @click="confirmShutdown = false" class="btn btn-secondary">Cancel</button>
                                        <button @click="powerAction('shutdown')" class="btn btn-danger">Shutdown</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Alpine Backup (LBU)</h3></div>
                            <div class="panel-body">
                                <div class="toolbar">
                                    <button @click="lbuCommit()" class="btn">Commit</button>
                                    <button @click="loadLbu()" class="btn btn-secondary">Refresh</button>
                                </div>
                                <pre x-show="lbuStatus" style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:150px;white-space:pre-wrap;word-break:break-all;" x-text="lbuStatus"></pre>
                                <div x-show="!lbuStatus" class="empty-state" style="padding:0.5rem;">No LBU status available.</div>
                                <div style="margin-top:1rem;" x-show="lbuBackups.length > 0">
                                    <h4 style="font-size:14px;margin-bottom:0.5rem;color:var(--text-secondary);">Backups</h4>
                                    <table class="data-table" role="table" aria-label="LBU backups">
                                        <thead>
                                            <tr role="row">
                                                <th role="columnheader">Backup</th>
                                                <th role="columnheader" class="actions-col">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="b in lbuBackups" :key="b">
                                                <tr role="row">
                                                    <td role="cell" x-text="b" class="mono"></td>
                                                    <td role="cell" class="actions-col">
                                                        <button @click="lbuRestore(b)" class="btn btn-sm">Restore</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <div x-show="lbuBackups.length === 0" class="empty-state" style="padding:0.5rem;">No backups found.</div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>DNS Resolver (resolv.conf)</h3></div>
                            <div class="panel-body">
                                <div x-show="!showResolvEdit">
                                    <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all;" x-text="resolvContent || 'No resolv.conf loaded.'"></pre>
                                    <button @click="showResolvEdit = true; loadResolv();" class="btn btn-sm btn-secondary" style="margin-top:0.5rem">Edit</button>
                                </div>
                                <div x-show="showResolvEdit">
                                    <div class="form-row">
                                        <textarea x-model="resolvContent" rows="8" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;" placeholder="nameserver 8.8.8.8"></textarea>
                                    </div>
                                    <div class="btn-group">
                                        <button @click="saveResolv()" class="btn">Save</button>
                                        <button @click="showResolvEdit = false" class="btn btn-secondary">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Configuration</h3></div>
                            <div class="panel-body">
                                <div class="btn-group">
                                    <button @click="exportConfig()" class="btn">Export config.json</button>
                                    <label class="btn btn-secondary" style="cursor:pointer;">
                                        Import config.json
                                        <input type="file" accept="application/json" @change="importConfig($event)" style="display:none;">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ AUDIT ============ -->
                    <section x-show="tab === 'audit'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="audit-heading">
                        <h2 id="audit-heading" class="section-title">Audit Log</h2>

                        <div class="toolbar">
                            <button @click="loadAuditLog()" class="btn" aria-label="Refresh audit log">Refresh</button>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Audit log entries">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Time</th>
                                            <th role="columnheader">Level</th>
                                            <th role="columnheader">Message</th>
                                            <th role="columnheader">Caller</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="entry in auditLog" :key="entry.ts + entry.msg">
                                            <tr role="row">
                                                <td role="cell" x-text="entry.ts || '-'" class="mono" style="white-space:nowrap;"></td>
                                                <td role="cell">
                                                    <span class="badge" :class="'badge-' + (entry.lvl === 'ERROR' ? 'danger' : (entry.lvl === 'WARN' ? 'warning' : 'subtle'))" x-text="entry.lvl || 'INFO'"></span>
                                                </td>
                                                <td role="cell" x-text="entry.msg || entry.raw || '-'" style="font-size:12px;word-break:break-all;"></td>
                                                <td role="cell" x-text="entry.caller || '-'" class="mono" style="font-size:11px;"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="auditLog.length === 0" class="empty-state">No audit log entries.</div>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
        </template>
    </div>
</body>
</html>
