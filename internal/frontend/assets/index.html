<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alpine WebAdmin - System management interface">
    <meta name="theme-color" content="#0f172a">
    <title>Alpine WebAdmin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/alpine.min.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="app" x-data="app()" x-init="initApp()">
        <!-- Login Screen -->
        <template x-if="!authenticated">
            <div class="login-screen" role="main" aria-label="Login">
                <div class="login-box">
                    <h1>Alpine WebAdmin</h1>
                    <p class="login-subtitle">System Management</p>
                    <form @submit.prevent="login()" aria-label="Authentication">
                        <input type="text" style="display:none" autocomplete="username">
                        <label for="password">Password</label>
                        <input id="password" type="password" x-model="password"
                               placeholder="Enter password" required
                               autocomplete="current-password"
                               aria-describedby="login-error"
                               @keydown.enter="login()">
                        <p id="login-error" class="error" x-show="loginError" x-text="loginError" role="alert"></p>
                        <button type="submit" :aria-busy="loginLoading">
                            <span x-show="!loginLoading">Sign In</span>
                            <span x-show="loginLoading">Signing in...</span>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- Main Application -->
        <template x-if="authenticated">
            <div class="app-layout" :class="{'sidebar-open': sidebarOpen}">
                <!-- Mobile header -->
                <header class="mobile-header" role="banner">
                    <button class="menu-toggle"
                            @click="sidebarOpen = !sidebarOpen"
                            :aria-expanded="sidebarOpen"
                            aria-label="Toggle navigation menu"
                            aria-controls="sidebar-nav">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <span class="mobile-title">Alpine WebAdmin</span>
                    <button @click="logout()" aria-label="Sign out" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                        </svg>
                    </button>
                </header>

                <!-- Sidebar -->
                <nav id="sidebar-nav"
                     class="sidebar"
                     role="navigation"
                     aria-label="Main navigation"
                     @keydown.escape.window="sidebarOpen = false">
                    <div class="sidebar-brand">
                        <span class="brand-icon">&#9670;</span>
                        <span class="brand-text">WebAdmin</span>
                    </div>

                    <ul class="nav-list" role="menubar">
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('dashboard')"
                                    :class="{active: tab==='dashboard'}"
                                    :aria-current="tab==='dashboard' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                                Dashboard
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('services')"
                                    :class="{active: tab==='services'}"
                                    :aria-current="tab==='services' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                Services
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('packages')"
                                    :class="{active: tab==='packages'}"
                                    :aria-current="tab==='packages' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                                Packages
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('network')"
                                    :class="{active: tab==='network'}"
                                    :aria-current="tab==='network' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><path d="M5.64 18.36a9 9 0 1 1 12.72 0M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                                Network
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('storage')"
                                    :class="{active: tab==='storage'}"
                                    :aria-current="tab==='storage' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                                Storage
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('modules')"
                                    :class="{active: tab==='modules'}"
                                    :aria-current="tab==='modules' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                                Modules
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('users')"
                                    :class="{active: tab==='users'}"
                                    :aria-current="tab==='users' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                Users
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('cron')"
                                    :class="{active: tab==='cron'}"
                                    :aria-current="tab==='cron' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                Cron
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('processes')"
                                    :class="{active: tab==='processes'}"
                                    :aria-current="tab==='processes' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                                Processes
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('logs')"
                                    :class="{active: tab==='logs'}"
                                    :aria-current="tab==='logs' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                Logs
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('sessions')"
                                    :class="{active: tab==='sessions'}"
                                    :aria-current="tab==='sessions' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                Sessions
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('audit')"
                                    :class="{active: tab==='audit'}"
                                    :aria-current="tab==='audit' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                Audit
                            </button>
                        </li>
                        <li role="none">
                            <button role="menuitem"
                                    @click="switchTab('system')"
                                    :class="{active: tab==='system'}"
                                    :aria-current="tab==='system' ? 'page' : null">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.67 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.67 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.67a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                System
                            </button>
                        </li>
                    </ul>

                    <div class="sidebar-footer">
                        <span class="version" x-text="'v' + version"></span>
                        <button @click="logout()" class="logout-btn" aria-label="Sign out">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                            </svg>
                            Sign Out
                        </button>
                    </div>
                </nav>

                <!-- Overlay for mobile sidebar -->
                <div class="sidebar-overlay"
                     x-show="sidebarOpen"
                     @click="sidebarOpen = false"
                     aria-hidden="true"></div>

                <!-- Main Content -->
                <main id="main-content" class="main" role="main" tabindex="-1">
                    <!-- Alerts Banner -->
                    <div class="alerts-region" role="region" aria-label="System alerts"
                         x-show="alerts.length > 0">
                        <template x-for="alert in alerts" :key="alert.id">
                            <div class="alert" :class="'alert-' + alert.level" role="alert">
                                <span class="alert-icon" x-text="alert.level === 'error' ? '!' : 'i'"></span>
                                <span x-text="alert.message"></span>
                                <button class="alert-close"
                                        @click="dismissAlert(alert.id)"
                                        :aria-label="'Dismiss alert: ' + alert.message">&times;</button>
                            </div>
                        </template>
                    </div>

                    <!-- ============ DASHBOARD ============ -->
                    <section x-show="tab === 'dashboard'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="dashboard-heading">
                        <h2 id="dashboard-heading" class="section-title">Dashboard</h2>

                        <div class="metrics-grid">
                            <div class="metric-card" tabindex="0">
                                <div class="metric-header">
                                    <span class="metric-label">CPU</span>
                                    <span class="metric-trend" :class="cpuTrend">&#9650;</span>
                                </div>
                                <div class="metric-value" x-text="(telemetry.cpu?.aggregate ?? 0).toFixed(1) + '%'"></div>
                                <div class="metric-sub" x-text="(telemetry.cpu?.per_core?.length || 0) + ' cores'"></div>
                                <div class="metric-bar">
                                    <div class="metric-bar-fill" :style="'width:' + (telemetry.cpu?.aggregate ?? 0) + '%'"></div>
                                </div>
                            </div>

                            <div class="metric-card" tabindex="0">
                                <div class="metric-header">
                                    <span class="metric-label">Memory</span>
                                </div>
                                <div class="metric-value" x-text="formatKB(telemetry.memory?.used_kb)"></div>
                                <div class="metric-sub" x-text="'of ' + formatKB(telemetry.memory?.total_kb)"></div>
                                <div class="metric-bar">
                                    <div class="metric-bar-fill"
                                         :style="'width:' + ((telemetry.memory?.used_kb / telemetry.memory?.total_kb * 100) || 0) + '%'"></div>
                                </div>
                            </div>

                            <div class="metric-card" tabindex="0">
                                <div class="metric-header">
                                    <span class="metric-label">Load</span>
                                </div>
                                <div class="metric-value" x-text="(telemetry.load?.load1 ?? 0).toFixed(2)"></div>
                                <div class="metric-sub">1 min avg</div>
                            </div>

                            <div class="metric-card" tabindex="0">
                                <div class="metric-header">
                                    <span class="metric-label">Uptime</span>
                                </div>
                                <div class="metric-value" x-text="formatDuration(telemetry.uptime_sec)"></div>
                                <div class="metric-sub" x-text="telemetry.hostname"></div>
                            </div>

                            <div class="metric-card" tabindex="0" x-show="telemetry.temp_c">
                                <div class="metric-header">
                                    <span class="metric-label">Temperature</span>
                                </div>
                                <div class="metric-value" x-text="(telemetry.temp_c ?? 0).toFixed(1) + ' &deg;C'"></div>
                            </div>

                            <div class="metric-card" tabindex="0">
                                <div class="metric-header">
                                    <span class="metric-label">Disk</span>
                                </div>
                                <div class="metric-value" x-text="diskUsedPercent() + '%'"></div>
                                <div class="metric-sub">avg usage</div>
                            </div>

                            <div class="metric-card" tabindex="0" @click="switchTab('packages')" style="cursor:pointer">
                                <div class="metric-header">
                                    <span class="metric-label">Updates</span>
                                </div>
                                <div class="metric-value" x-text="updatesCount"></div>
                                <div class="metric-sub" x-text="updatesCount > 0 ? 'packages available' : 'system up to date'"></div>
                            </div>

                            <div class="metric-card" tabindex="0" @click="switchTab('dashboard'); loadSystemAlerts();" style="cursor:pointer">
                                <div class="metric-header">
                                    <span class="metric-label">Alerts</span>
                                </div>
                                <div class="metric-value" x-text="systemAlerts.filter(a => a.level !== 'info').length"></div>
                                <div class="metric-sub" x-text="systemAlerts.length > 0 ? (systemAlerts.some(a => a.level === 'error') ? 'critical' : 'warning') : 'all clear'"></div>
                            </div>
                        </div>

                        <div class="panel" x-show="systemAlerts.length > 0 && systemAlerts.some(a => a.level !== 'info')">
                            <div class="panel-header"><h3>System Alerts</h3></div>
                            <div class="panel-body">
                                <template x-for="alert in systemAlerts" :key="alert.timestamp + alert.message">
                                    <div class="alert" :class="'alert-' + alert.level" role="alert" style="margin-bottom:0.5rem;">
                                        <span class="alert-icon" x-text="alert.level === 'error' ? '!' : (alert.level === 'warning' ? '!' : 'i')"></span>
                                        <span x-text="alert.message"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header">
                                <h3>Disk Usage</h3>
                            </div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Disk usage by mountpoint">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Device</th>
                                            <th role="columnheader">Mount</th>
                                            <th role="columnheader">Used</th>
                                            <th role="columnheader">Total</th>
                                            <th role="columnheader">Usage</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="m in telemetry.mounts" :key="m.mountpoint">
                                            <tr role="row">
                                                <td role="cell" x-text="m.device"></td>
                                                <td role="cell" x-text="m.mountpoint"></td>
                                                <td role="cell" x-text="formatKB(m.used_kb)"></td>
                                                <td role="cell" x-text="formatKB(m.total_kb)"></td>
                                                <td role="cell">
                                                    <div class="inline-bar">
                                                        <div class="inline-bar-fill"
                                                             :style="'width:' + ((m.used_kb / m.total_kb * 100) || 0) + '%'"
                                                             :class="diskBarClass(m.used_kb, m.total_kb)"></div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header">
                                <h3>Network Interfaces</h3>
                            </div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Network interface statistics">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Interface</th>
                                            <th role="columnheader">RX</th>
                                            <th role="columnheader">TX</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="iface in telemetry.network" :key="iface.interface">
                                            <tr role="row">
                                                <td role="cell" x-text="iface.interface"></td>
                                                <td role="cell" x-text="formatBytes(iface.rx_bytes)"></td>
                                                <td role="cell" x-text="formatBytes(iface.tx_bytes)"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>

                    <!-- ============ SERVICES ============ -->
                    <section x-show="tab === 'services'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="services-heading">
                        <h2 id="services-heading" class="section-title">Services</h2>

                        <div class="toolbar">
                            <div class="toolbar-group">
                                <input type="search"
                                       x-model="serviceFilter"
                                       placeholder="Filter services..."
                                       class="search-input"
                                       aria-label="Filter services">
                                <button @click="loadServices()" class="btn" aria-label="Refresh services">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                                    Refresh
                                </button>
                            </div>
                            <span class="toolbar-meta" x-text="filteredServices().length + ' services'"></span>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="OpenRC services">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Service</th>
                                            <th role="columnheader">Status</th>
                                            <th role="columnheader">Runlevel</th>
                                            <th role="columnheader">Enabled</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="svc in filteredServices()" :key="svc.name">
                                            <tr role="row" :class="{'row-disabled': svc._loading}">
                                                <td role="cell" x-text="svc.name"></td>
                                                <td role="cell">
                                                    <span class="badge"
                                                          :class="'badge-' + svc.status"
                                                          x-text="svc.status"></span>
                                                </td>
                                                <td role="cell" x-text="svc.runlevel || '-'"></td>
                                                <td role="cell">
                                                    <span class="badge badge-subtle"
                                                          x-text="svc.enabled ? 'Yes' : 'No'"></span>
                                                </td>
                                                <td role="cell" class="actions-col">
                                                    <button class="btn btn-sm"
                                                            @click="serviceAction(svc.name, 'start')"
                                                            :disabled="svc.status === 'started' || svc._loading"
                                                            :aria-label="'Start ' + svc.name">
                                                        Start
                                                    </button>
                                                    <button class="btn btn-sm btn-danger"
                                                            @click="serviceAction(svc.name, 'stop')"
                                                            :disabled="svc.status === 'stopped' || svc._loading"
                                                            :aria-label="'Stop ' + svc.name">
                                                        Stop
                                                    </button>
                                                    <button class="btn btn-sm"
                                                            @click="serviceAction(svc.name, 'restart')"
                                                            :disabled="svc._loading"
                                                            :aria-label="'Restart ' + svc.name">
                                                        Restart
                                                    </button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="serviceAction(svc.name, 'enable')"
                                                            :disabled="svc.enabled || svc._loading"
                                                            :aria-label="'Enable ' + svc.name + ' at boot'">
                                                        Enable
                                                    </button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="serviceAction(svc.name, 'disable')"
                                                            :disabled="!svc.enabled || svc._loading"
                                                            :aria-label="'Disable ' + svc.name + ' at boot'">
                                                        Disable
                                                    </button>
                                                    <button class="btn btn-sm"
                                                            @click="showServiceLogModal(svc.name)"
                                                            :aria-label="'View log for ' + svc.name">
                                                        Log
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!-- Service log modal -->
                        <div x-show="showServiceLog" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="svc-log-title">
                            <div class="modal" style="max-width:900px;">
                                <div class="modal-header">
                                    <h3 id="svc-log-title" x-text="'Log: ' + serviceLogName"></h3>
                                    <button @click="closeServiceLog()" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div x-show="serviceLogStatus" style="margin-bottom:0.75rem;padding:0.5rem;background:var(--bg-tertiary);border-radius:var(--radius-sm);font-size:13px;" x-text="serviceLogStatus"></div>
                                    <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all;" x-text="serviceLogContent || 'No log available.'"></pre>
                                </div>
                                <div class="modal-actions">
                                    <button @click="closeServiceLog()" class="btn btn-secondary">Close</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ PACKAGES ============ -->
                    <section x-show="tab === 'packages'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="packages-heading">
                        <h2 id="packages-heading" class="section-title">Packages</h2>

                        <div class="toolbar">
                            <div class="toolbar-group">
                                <input type="search"
                                       x-model="packageFilter"
                                       placeholder="Search packages..."
                                       class="search-input"
                                       @keydown.enter="searchPackages()"
                                       aria-label="Search packages">
                                <button @click="searchPackages()" class="btn" aria-label="Search">Search</button>
                                <div class="btn-group" role="group" aria-label="Package view filter">
                                    <button @click="setPackageView('all')"
                                            :class="packageView === 'all' ? 'btn btn-primary' : 'btn'"
                                            aria-label="Show all packages">All</button>
                                    <button @click="setPackageView('available')"
                                            :class="packageView === 'available' ? 'btn btn-primary' : 'btn'"
                                            aria-label="Show available packages">Available</button>
                                    <button @click="setPackageView('installed')"
                                            :class="packageView === 'installed' ? 'btn btn-primary' : 'btn'"
                                            aria-label="Show installed packages">Installed</button>
                                </div>
                            </div>
                            <div class="toolbar-group">
                                <button @click="packageAction('update')" class="btn btn-secondary" :disabled="pkgOpLoading" aria-label="Update index">Update Index</button>
                                <button @click="packageAction('upgrade')" class="btn btn-secondary" :disabled="pkgOpLoading" aria-label="Upgrade all">Upgrade All</button>
                                <button @click="showApkRepoEdit = true" class="btn btn-secondary" aria-label="Edit repositories">Repositories</button>
                            </div>
                        </div>

                        <div x-show="showApkRepoEdit" class="panel">
                            <div class="panel-header"><h3>APK Repositories</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <textarea x-model="apkRepos" rows="8" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;" placeholder="https://dl-cdn.alpinelinux.org/alpine/v3.19/main&#10;https://dl-cdn.alpinelinux.org/alpine/v3.19/community"></textarea>
                                </div>
                                <div class="btn-group">
                                    <button @click="saveApkRepos()" class="btn">Save</button>
                                    <button @click="showApkRepoEdit = false" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <template x-if="pkgOp && (pkgOp.state === 'running' || pkgOp.state === 'pending')">
                            <div class="panel panel-info">
                                <div class="panel-header">
                                    <h3 x-text="'Operation: ' + pkgOp.type + ' (' + pkgOp.state + ')'"></h3>
                                </div>
                                <div class="panel-body">
                                    <div class="progress-log" role="log" aria-live="polite" aria-atomic="false">
                                        <template x-for="line in pkgOp.progress" :key="line.ts">
                                            <div class="log-line" x-text="line.line"></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Package list">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Package</th>
                                            <th role="columnheader">Version</th>
                                            <th role="columnheader">Description</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="pkg in visiblePackages" :key="pkg.name">
                                            <tr role="row">
                                                <td role="cell">
                                                    <span x-text="pkg.name"></span>
                                                    <span x-show="pkg.installed" class="badge badge-ok" style="margin-left:0.4rem;">installed</span>
                                                </td>
                                                <td role="cell" x-text="pkg.version || '-'" class="mono"></td>
                                                <td role="cell" x-text="pkg.description || '-'" class="description-cell"></td>
                                                <td role="cell" class="actions-col">
                                                    <button class="btn btn-sm"
                                                            x-show="!pkg.installed"
                                                            @click="installPackage(pkg.name)"
                                                            :disabled="pkgOpLoading"
                                                            :aria-label="'Install ' + pkg.name">Install</button>
                                                    <button class="btn btn-sm btn-danger"
                                                            x-show="pkg.installed"
                                                            @click="showRemoveConfirm(pkg.name)"
                                                            :disabled="pkgOpLoading"
                                                            :aria-label="'Remove ' + pkg.name">Remove</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="packages.length === 0 && !pkgLoading" class="empty-state">No packages found.</div>
                                <div x-show="pkgLoading" class="empty-state">Loading...</div>
                                <div x-show="packages.length > 0 && !pkgLoading"
                                     style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; gap:0.75rem;">
                                    <span style="color: var(--text-muted); font-size: 13px;"
                                          x-text="'Showing ' + Math.min(pkgVisibleCount, packages.length) + ' of ' + packages.length"></span>
                                    <button class="btn"
                                            x-show="pkgVisibleCount < packages.length"
                                            @click="loadMorePackages()"
                                            aria-label="Load more packages">Load More</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Package removal confirmation -->
                    <div x-show="confirmRemovePackage" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="remove-pkg-title">
                        <div class="modal">
                            <div class="modal-header">
                                <h3 id="remove-pkg-title">Confirm Package Removal</h3>
                                <button @click="confirmRemovePackage = ''" class="modal-close" aria-label="Close dialog">&times;</button>
                            </div>
                            <div class="modal-body">
                                <p>Are you sure you want to remove <strong x-text="confirmRemovePackage"></strong>?</p>
                                <p style="font-size: 0.9em; color: #999;">This action cannot be undone.</p>
                                <div class="modal-actions">
                                    <button @click="confirmRemovePackage = ''" class="btn btn-secondary">Cancel</button>
                                    <button @click="removePackage(confirmRemovePackage)" class="btn btn-danger">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ============ NETWORK ============ -->
                    <section x-show="tab === 'network'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="network-heading">
                        <h2 id="network-heading" class="section-title">Network</h2>

                        <div class="toolbar">
                            <button @click="loadNetwork(); loadNetworkInterfaces();" class="btn" aria-label="Refresh network">Refresh</button>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Interfaces</h3></div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Network interfaces">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Interface</th>
                                            <th role="columnheader">RX Bytes</th>
                                            <th role="columnheader">RX Packets</th>
                                            <th role="columnheader">TX Bytes</th>
                                            <th role="columnheader">TX Packets</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="iface in networkData" :key="iface.interface">
                                            <tr role="row">
                                                <td role="cell" x-text="iface.interface"></td>
                                                <td role="cell" x-text="formatBytes(iface.rx_bytes)"></td>
                                                <td role="cell" x-text="formatNumber(iface.rx_packets)"></td>
                                                <td role="cell" x-text="formatBytes(iface.tx_bytes)"></td>
                                                <td role="cell" x-text="formatNumber(iface.tx_packets)"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="networkData.length === 0" class="empty-state">No network data available.</div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Interface Control</h3></div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Interface states">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Interface</th>
                                            <th role="columnheader">State</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="iface in networkInterfaces" :key="iface.name">
                                            <tr role="row">
                                                <td role="cell" x-text="iface.name"></td>
                                                <td role="cell">
                                                    <span class="badge"
                                                          :class="iface.state === 'up' ? 'badge-ok' : (iface.state === 'down' ? 'badge-warning' : 'badge-subtle')"
                                                          x-text="iface.state"></span>
                                                </td>
                                                <td role="cell" class="actions-col">
                                                    <button class="btn btn-sm" @click="netIfUp(iface.name)" :disabled="iface.state === 'up'">Up</button>
                                                    <button class="btn btn-sm btn-danger" @click="netIfDown(iface.name)" :disabled="iface.state === 'down'">Down</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="networkInterfaces.length === 0" class="empty-state">No interface data available.</div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Routes</h3></div>
                            <div class="panel-body">
                                <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all;" x-text="routesContent || 'No route data available.'"></pre>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Firewall</h3></div>
                            <div class="panel-body">
                                <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all;" x-text="firewallContent || 'No firewall data available.'"></pre>
                            </div>
                        </div>
                    </section>

                    <!-- ============ STORAGE ============ -->
                    <section x-show="tab === 'storage'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="storage-heading">
                        <h2 id="storage-heading" class="section-title">Storage</h2>

                        <div class="toolbar">
                            <button @click="loadStorage()" class="btn" aria-label="Refresh storage">Refresh</button>
                            <button @click="showMountForm = true" class="btn btn-secondary" aria-label="Mount device">Mount</button>
                            <button @click="showFstabEdit = true" class="btn btn-secondary" aria-label="Edit fstab">fstab</button>
                        </div>

                        <div x-show="showMountForm" class="panel">
                            <div class="panel-header"><h3>Mount Device</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <label for="mount-device">Device</label>
                                    <input id="mount-device" type="text" x-model="mountForm.device" placeholder="/dev/sdb1">
                                </div>
                                <div class="form-row">
                                    <label for="mount-point">Mountpoint</label>
                                    <input id="mount-point" type="text" x-model="mountForm.mountpoint" placeholder="/mnt/data">
                                </div>
                                <div class="form-row">
                                    <label for="mount-fstype">Filesystem type (optional)</label>
                                    <input id="mount-fstype" type="text" x-model="mountForm.fstype" placeholder="ext4">
                                </div>
                                <div class="btn-group">
                                    <button @click="mountDevice()" class="btn">Mount</button>
                                    <button @click="showMountForm = false" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Filesystems</h3></div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Filesystem usage">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Filesystem</th>
                                            <th role="columnheader">Size</th>
                                            <th role="columnheader">Used</th>
                                            <th role="columnheader">Available</th>
                                            <th role="columnheader">Use%</th>
                                            <th role="columnheader">Mounted on</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="fs in storageData" :key="fs.mountpoint">
                                            <tr role="row">
                                                <td role="cell" x-text="fs.filesystem"></td>
                                                <td role="cell" x-text="fs.size"></td>
                                                <td role="cell" x-text="fs.used"></td>
                                                <td role="cell" x-text="fs.available"></td>
                                                <td role="cell">
                                                    <span class="badge"
                                                          :class="fs.usePercent > 90 ? 'badge-error' : (fs.usePercent > 75 ? 'badge-warning' : 'badge-ok')"
                                                          x-text="fs.usePercent + '%'"></span>
                                                </td>
                                                <td role="cell" x-text="fs.mountpoint"></td>
                                                <td role="cell">
                                                    <button @click="unmountDevice(fs.mountpoint)" class="btn btn-sm btn-danger" aria-label="Unmount filesystem">Unmount</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="storageData.length === 0" class="empty-state">No storage data available.</div>
                            </div>
                        </div>

                        <div x-show="showFstabEdit" class="panel">
                            <div class="panel-header"><h3>Edit fstab</h3></div>
                            <div class="panel-body">
                                <div class="form-row">
                                    <textarea x-model="fstabContent" rows="10" style="width:100%;font-family:monospace;font-size:12px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:0.5rem;" placeholder="/dev/sda1 / ext4 defaults 0 1"></textarea>
                                </div>
                                <div class="btn-group">
                                    <button @click="saveFstab()" class="btn">Save</button>
                                    <button @click="showFstabEdit = false" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>fstab</h3></div>
                            <div class="panel-body">
                                <pre style="background:var(--bg-input);padding:0.5rem;border-radius:var(--radius-sm);font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;" x-text="fstabContent || 'No fstab entries.'"></pre>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header"><h3>Block Devices</h3></div>
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="Block devices">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Name</th>
                                            <th role="columnheader">Size</th>
                                            <th role="columnheader">Type</th>
                                            <th role="columnheader">Mountpoint</th>
                                            <th role="columnheader">Model</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="dev in blockDevices" :key="dev.name">
                                            <tr role="row">
                                                <td role="cell" x-text="dev.name" class="mono"></td>
                                                <td role="cell" x-text="dev.size"></td>
                                                <td role="cell">
                                                    <span class="badge badge-subtle" x-text="dev.type"></span>
                                                </td>
                                                <td role="cell" x-text="dev.mountpoint || '-'" class="mono"></td>
                                                <td role="cell" x-text="dev.model || '-'" style="font-size:12px;"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="blockDevices.length === 0" class="empty-state">No block device data available.</div>
                            </div>
                        </div>
                    </section>

                    <!-- ============ USERS ============ -->
                    <section x-show="tab === 'users'"
                             x-transition:enter="transition-enter"
                             x-transition:enter-start="transition-enter-start"
                             x-transition:enter-end="transition-enter-end"
                             aria-labelledby="users-heading">
                        <h2 id="users-heading" class="section-title">Users</h2>

                        <div class="toolbar">
                            <div class="toolbar-group">
                                <button @click="loadUsers()" class="btn" aria-label="Refresh users">Refresh</button>
                                <button @click="showCreateUser = true" class="btn btn-primary" aria-label="Create user">Create User</button>
                            </div>
                        </div>

                        <!-- Create user modal -->
                        <div x-show="showCreateUser" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="create-user-title">
                            <div class="modal">
                                <div class="modal-header">
                                    <h3 id="create-user-title">Create User</h3>
                                    <button @click="showCreateUser = false" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <form @submit.prevent="createUser()" class="modal-body">
                                    <label for="new-username">Username</label>
                                    <input id="new-username" type="text" x-model="newUser.username" required pattern="[a-z_][a-z0-9_-]*">

                                    <label for="new-home">Home Directory</label>
                                    <input id="new-home" type="text" x-model="newUser.home" placeholder="/home/username">

                                    <label for="new-shell">Shell</label>
                                    <input id="new-shell" type="text" x-model="newUser.shell" placeholder="/bin/ash">

                                    <p class="error" x-show="userError" x-text="userError" role="alert"></p>

                                    <div class="modal-actions">
                                        <button type="button" @click="showCreateUser = false" class="btn btn-secondary">Cancel</button>
                                        <button type="submit" class="btn btn-primary">Create</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-body">
                                <table class="data-table" role="table" aria-label="System users">
                                    <thead>
                                        <tr role="row">
                                            <th role="columnheader">Username</th>
                                            <th role="columnheader">UID</th>
                                            <th role="columnheader">GID</th>
                                            <th role="columnheader">Home</th>
                                            <th role="columnheader">Shell</th>
                                            <th role="columnheader" class="actions-col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="u in users" :key="u.username">
                                            <tr role="row">
                                                <td role="cell" x-text="u.username"></td>
                                                <td role="cell" x-text="u.uid" class="mono"></td>
                                                <td role="cell" x-text="u.gid" class="mono"></td>
                                                <td role="cell" x-text="u.home" class="mono"></td>
                                                <td role="cell" x-text="u.shell" class="mono"></td>
                                                <td role="cell" class="actions-col">
                                                    <button class="btn btn-sm"
                                                            @click="resetPassword(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Reset password for ' + u.username">Reset Password</button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="lockUser(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Lock user ' + u.username">Lock</button>
                                                    <button class="btn btn-sm"
                                                            @click="unlockUser(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Unlock user ' + u.username">Unlock</button>
                                                    <button class="btn btn-sm btn-danger"
                                                            @click="deleteUser(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Delete user ' + u.username">Delete</button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="showGroupManageModal(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Manage groups for ' + u.username">Groups</button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="openShellChange(u.username, u.shell)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Change shell for ' + u.username">Shell</button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            @click="openSshKeys(u.username)"
                                                            :disabled="u._loading"
                                                            :aria-label="'Edit SSH keys for ' + u.username">SSH Keys</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div x-show="users.length === 0" class="empty-state">No users found.</div>
                            </div>
                        </div>
                        <!-- Group management modal -->
                        <div x-show="showGroupManage" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="groups-title">
                            <div class="modal" style="max-width:500px;">
                                <div class="modal-header">
                                    <h3 id="groups-title" x-text="'Groups: ' + groupManageUser"></h3>
                                    <button @click="closeGroupManage()" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div class="form-row">
                                        <label>Add to group</label>
                                        <div style="display:flex;gap:0.5rem;">
                                            <input type="text" x-model="newGroupName" placeholder="groupname" style="flex:1;" @keydown.enter="addUserGroup()">
                                            <button @click="addUserGroup()" class="btn">Add</button>
                                        </div>
                                    </div>
                                    <div style="margin-top:1rem;">
                                        <h4 style="font-size:14px;margin-bottom:0.5rem;color:var(--text-secondary);">Current groups</h4>
                                        <div style="display:flex;flex-wrap:wrap;gap:0.4rem;">
                                            <template x-for="g in userGroups" :key="g">
                                                <span class="badge badge-subtle" style="display:flex;align-items:center;gap:0.3rem;">
                                                    <span x-text="g"></span>
                                                    <button @click="removeUserGroup(g)" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:12px;line-height:1;" aria-label="Remove group">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <div x-show="userGroups.length === 0" class="empty-state" style="padding:0.5rem;">No groups.</div>
                                    </div>
                                </div>
                                <div class="modal-actions">
                                    <button @click="closeGroupManage()" class="btn btn-secondary">Close</button>
                                </div>
                            </div>
                        </div>

                        <!-- Shell change modal -->
                        <div x-show="showShellChange" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="shell-title">
                            <div class="modal" style="max-width:500px;">
                                <div class="modal-header">
                                    <h3 id="shell-title" x-text="'Change Shell: ' + shellChangeUser"></h3>
                                    <button @click="closeShellChange()" class="modal-close" aria-label="Close dialog">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div class="form-row">

                                </div>
                                <div class="modal-actions">
                                    <button @click="saveShell()" class="btn">Save</button>
                                    <button @click="closeShellChange()" class="btn btn-secondary">Cancel</button>
                                </div>
                            </div>

                                <div class="modal-header">
